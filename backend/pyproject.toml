[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "PyJWT>=2.9",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

# app_dist/ (OTA APK'si) ve scripts/ paket degil - sadece app/ build edilir.
[tool.setuptools.packages.find]
include = ["app", "app.*"]
