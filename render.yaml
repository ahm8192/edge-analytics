services:
  - type: web
    name: edge-analytics-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      # API-Football (api-sports.io) ücretsiz anahtar — sakatlık verisi
      - key: API_FOOTBALL_KEY
        sync: false
      # The Odds API (the-odds-api.com) ücretsiz anahtar — Pinnacle + 20+ bahisçi
      - key: ODDS_API_KEY
        sync: false
      # Ucretsiz plan dakikada ~10 istek; onbellek + throttle ile 9 lig guvenli.
      - key: FOOTBALL_DATA_COMPETITIONS
        value: PL,ELC,BL1,SA,PD,FL1,DED,PPL,BSA
      - key: FOOTBALL_DATA_CACHE_TTL
        value: "180"
      - key: FOOTBALL_DATA_REQUEST_SPACING
        value: "1.2"
